<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Frontend Mentor | Intro component with sign up form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body
  class="flex flex-col p-5 pt-15 pb-15 items-center text-center gap-15 bg-[hsl(0,100%,74%)]/99 bg-[url('./images/bg-intro-mobile.png')] md:bg-[url('./images/bg-intro-desktop.png')]">
  <div name="upper-part" class="flex flex-col gap-5">
    <div name="title" class="font-[Poppins] text-3xl text-white font-bold">
      Learn to code by watching others
    </div>
    <div name="desc" class="text-white">
      See how experienced developers solve problems in real-time. Watching scripted tutorials is great,
      but understanding how developers think is invaluable.
    </div>
  </div>
  <div name="lower-part" class="flex flex-col gap-5">
    <div name="free-trial" class="font-[Poppins] p-4 rounded-lg cursor-pointer bg-[hsl(248,32%,49%)] text-white shadow-[0_7px_0_0_hsl(248,32%,39%)]/30 hover:cursor-pointer">
      <span class="block max-w-[220px] mx-auto"><b>Try it free 7 days</b> then $20/mo. thereafter</span>
    </div>
    <form class="bg-white rounded-lg flex flex-col gap-4 p-5 text-left shadow-[0_8px_0_0_hsl(248,32%,39%)]/20">
      <div class="border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4">
        <label for="first-name" class="sr-only">First Name</label>
        <input type="text" id="first-name" placeholder="First Name" class="w-full placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] font-semibold text-sm"/>
      </div>
      <div class="border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4">
        <label for="first-name" class="sr-only">Last Name</label>
        <input type="text" id="last-name" placeholder="Last Name" class="w-full placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] font-semibold text-sm"/>
      </div>
      <div class="border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4">
        <label for="first-name" class="sr-only">Email Address</label>
        <input type="text" id="email" placeholder="Email Address" class="w-full placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] font-semibold text-sm"/>
      </div>
      <div class="border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4">
        <label for="first-name" class="sr-only">Password</label>
        <input type="text" id="password" placeholder="Password" class="w-full placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] font-semibold text-sm"/>
      </div>
      <button class="font-[Poppins] bg-[hsl(154,59%,51%)] text-white p-3 rounded-lg shadow-[0_4px_0_0_hsl(154,59%,41%)] hover:cursor-pointer">
        <span class="font-[Poppins] font-semibold">CLAIM YOUR FREE TRIAL</span></button>

      <div name="info" class="max-w-[225px] mx-auto text-center">
        <span class="font-[Poppins] text-[10px] text-[hsl(249,10%,26%)]/50">
          By clicking the button, you are agreeing to our <span class="font-semibold text-[hsl(0,100%,74%)] hover:cursor-pointer">
            Terms and Services
          </span>
      
        </span>
      </div>
    </form>
      
  </div>

</body>

</html>
