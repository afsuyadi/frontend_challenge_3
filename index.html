<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Frontend Mentor | Intro component with sign up form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    .input-error {
      border-color: hsl(0, 100%, 74%) !important;
    }

    .input-error input::placeholder {
      color: transparent;
    }

    .text-claim {
      font: 600 15px Poppins;
      line-height: 1.75;
      letter-spacing: 2px;
    }
  </style>
</head>

<body
  class="px-[24px] py-[88px] items-center md:min-h-screen md:justify-center lg:flex-row lg:items-center lg:justify-center lg:min-h-screen lg:max-w-[1440px] lg:mx-auto text-center flex flex-col gap-15 bg-[hsl(0,100%,75%)]/99 bg-[url('./images/bg-intro-mobile.png')] lg:bg-[url('./images/bg-intro-desktop.png')]">
  <div name="upper-part" class="flex flex-col gap-8 lg:w-[556px] md:w-[540px] justify-center">
    <div name="title" class="md:w-[540px] lg:w-[540px] lg:text-left">
      <span
        class="font-[Poppins] min-w-[327px] font-bold text-[28px] md:text-5xl md:mx-auto lg:text-5xl text-white font-bold">
        Learn to code by watching others
      </span>
    </div>
    <div name="desc" class="md:w-[540px] lg:w-[540px] lg:text-left">
      <span class="text-white">
        See how experienced developers solve problems in real-time. Watching scripted tutorials is great,
        but understanding how developers think is invaluable.
      </span>
    </div>
  </div>
  <div name="lower-part" class="flex flex-col gap-5 lg:w-1/2 w-[327px] md:w-[540px] lg:w-[540px]">
    <div name="free-trial"
      class="font-[Poppins] p-4 sm:px-8 rounded-lg cursor-pointer bg-[hsl(248,32%,49%)] text-white shadow-[0_7px_0_0_hsl(248,32%,39%)]/30 hover:cursor-pointer">
      <span class="block sm:w-[194px] mx-auto md:w-auto lg:w-auto"><b>Try it free 7 days</b> then $20/mo.
        thereafter</span>
    </div>
    <form class="bg-white rounded-lg flex flex-col gap-4 p-5 text-left shadow-[0_8px_0_0_hsl(248,32%,39%)]/20">
      <div>
        <div id="first-name-field"
          class="mx-auto md:w-[460px] border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4 flex items-center">
          <label for="first-name" class="sr-only">First Name</label>
          <input type="text" id="first-name" placeholder="First Name"
            class="flex-1 min-w-0 placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] text-sm" />
          <img src="./images/icon-error.svg" id="first-name-icon" class="w-5 h-5 shrink-0 hidden" />
        </div>
        <p id="first-name-error" class="text-xs text-[hsl(0,100%,74%)] text-right pt-2 hidden italic"></p>
      </div>

      <div>
        <div id="last-name-field"
          class="mx-auto md:w-[460px] border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4 flex items-center">
          <label for="last-name" class="sr-only">Last Name</label>
          <input type="text" id="last-name" placeholder="Last Name"
            class="flex-1 min-w-0 placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] text-sm" />
          <img src="./images/icon-error.svg" id="last-name-icon" class="w-5 h-5 shrink-0 hidden" />
        </div>
        <p id="last-name-error" class="text-xs text-[hsl(0,100%,74%)] text-right pt-2 hidden italic"></p>
      </div>

      <div>
        <div id="email-field"
          class="mx-auto md:w-[460px] border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4 flex items-center">
          <label for="email" class="sr-only">Email Address</label>
          <input id="email" placeholder="Email Address"
            class="flex-1 min-w-0 placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] text-sm" />
          <img src="./images/icon-error.svg" id="email-icon" class="w-5 h-5 shrink-0 hidden" />
        </div>
        <p id="email-error" class="text-xs text-[hsl(0,100%,74%)] text-right pt-2 hidden italic"></p>
      </div>

      <div>
        <div id="password-field"
          class="mx-auto md:w-[460px] border border-[hsl(249,10%,26%)]/10 rounded-lg py-3 px-4 flex items-center">
          <label for="password" class="sr-only">Password</label>
          <input type="password" id="password" placeholder="Password"
            class="flex-1 min-w-0 placeholder:text-[hsl(249,10%,26%)]/70 font-[Poppins] text-sm" />
          <img src="./images/icon-error.svg" id="password-icon" class="w-5 h-5 shrink-0 hidden" />
        </div>
        <p id="password-error" class="text-xs text-[hsl(0,100%,74%)] text-right pt-2 hidden italic"></p>
      </div>

      <button type="submit"
        class="font-[Poppins] md:w-[460px] md:mx-auto bg-[hsl(154,59%,51%)] hover:bg-[hsl(154,59%,61%)] text-white p-3 rounded-lg shadow-[0_4px_0_0_hsl(154,59%,41%)] hover:cursor-pointer">
        <span class="text-claim">CLAIM YOUR FREE TRIAL</span></button>

      <div name="info" class="max-w-[225px] mx-auto text-center lg:max-w-none">
        <span class="font-[Poppins] text-[10px] text-[hsl(249,10%,26%)]/50">
          By clicking the button, you are agreeing to our <span
            class="font-semibold text-[hsl(0,100%,74%)] hover:cursor-pointer">
            Terms and Services
          </span>

        </span>
      </div>
    </form>

  </div>
  <script>
    const fields = [
      { name: "first-name", getError: (value) => value.trim().length > 0 ? null : "First Name cannot be empty" },
      { name: "last-name", getError: (value) => value.trim().length > 0 ? null : "Last Name cannot be empty" },
      {
        name: "email", getError: (value) => {
          const trimmed = value.trim();
          if (trimmed.length === 0) return "Email cannot be empty";
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) return "Looks like this is not an email";
          return null;
        }
      },
      { name: "password", getError: (value) => value.trim().length > 0 ? null : "Password cannot be empty" },
    ]
    const form = document.querySelector("form");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      fields.forEach(({ name, getError }) => {
        const input = document.getElementById(name);
        const errorMessage = getError(input.value);
        setFieldError(name, errorMessage);
      })
    })

    function setFieldError(name, errorMessage) {
      const wrapper = document.getElementById(`${name}-field`);
      const icon = document.getElementById(`${name}-icon`);
      const message = document.getElementById(`${name}-error`);
      wrapper.classList.toggle("input-error", errorMessage);
      icon.classList.toggle("hidden", !errorMessage);
      message.classList.toggle("hidden", !errorMessage);
      message.textContent = errorMessage;
    }
  </script>
</body>

</html>
